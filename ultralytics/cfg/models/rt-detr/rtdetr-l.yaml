# RT-DETR-l optimized for small object detection in remote sensing imagery
# Key improvements:
#   1. SPDConv replaces strided DWConv to prevent information loss during downsampling
#   2. LSKBlock in backbone stage3 for large-kernel multi-scale context (ICCV 2023)
#   3. P2 (stride-4) lightweight detection branch for small object features
#   4. EMA attention at P3 fusion for multi-scale feature enhancement (ICASSP 2023)

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  l: [1.00, 1.00, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, HGStem, [32, 48]] # 0-P2/4
  - [-1, 6, HGBlock, [48, 128, 3]] # 1 stage 1

  - [-1, 1, SPDConv, [128]] # 2-P3/8 (SPDConv: lossless downsampling)
  - [-1, 6, HGBlock, [96, 512, 3]] # 3 stage 2

  - [-1, 1, SPDConv, [512]] # 4-P4/16
  - [-1, 6, HGBlock, [192, 1024, 5, True, False]] # 5
  - [-1, 6, HGBlock, [192, 1024, 5, True, True]] # 6
  - [-1, 6, HGBlock, [192, 1024, 5, True, True]] # 7 stage 3
  - [-1, 1, LSKBlock, []] # 8 large selective kernel attention

  - [-1, 1, SPDConv, [1024]] # 9-P5/32
  - [-1, 6, HGBlock, [384, 2048, 5, True, False]] # 10 stage 4

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 11 input_proj.2
  - [-1, 1, AIFI, [1024, 8]] # 12
  - [-1, 1, Conv, [256, 1, 1]] # 13, Y5, lateral_convs.0

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [7, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 15 input_proj.1
  - [[-2, -1], 1, Concat, [1]] # 16
  - [-1, 3, RepC3, [256]] # 17, fpn_blocks.0
  - [-1, 1, Conv, [256, 1, 1]] # 18, Y4, lateral_convs.1

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 19
  - [3, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 20 input_proj.0 (from stage2 P3)
  - [[-2, -1], 1, Concat, [1]] # 21
  - [-1, 3, RepC3, [256]] # 22, X3, fpn_blocks.1
  - [-1, 1, EMA, [8]] # 23, EMA at P3 (most critical for small objects)

  # ---- P2 lightweight branch (stride-4) ----
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 24
  - [1, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 25 input_proj from stage1 (P2)
  - [[-2, -1], 1, Concat, [1]] # 26
  - [-1, 1, RepC3, [256]] # 27, X2 (P2, n=1 lightweight)

  # ---- PAN: bottom-up path ----
  - [-1, 1, Conv, [256, 3, 2]] # 28, downsample_convs.0
  - [[-1, 23], 1, Concat, [1]] # 29 cat X3
  - [-1, 3, RepC3, [256]] # 30, F3

  - [-1, 1, Conv, [256, 3, 2]] # 31, downsample_convs.1
  - [[-1, 18], 1, Concat, [1]] # 32 cat Y4
  - [-1, 3, RepC3, [256]] # 33, F4

  - [-1, 1, Conv, [256, 3, 2]] # 34, downsample_convs.2
  - [[-1, 13], 1, Concat, [1]] # 35 cat Y5
  - [-1, 3, RepC3, [256]] # 36, F5

  - [[27, 30, 33, 36], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 6]] # Decoder(P2, P3, P4, P5)

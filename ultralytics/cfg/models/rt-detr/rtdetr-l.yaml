# RT-DETR-L with Frequency-guided Bidirectional Cross-scale Attention (FBCA)
# Innovation:
#   1. DA_AIFI  – Deformable-Attention AIFI: adds a deformable sampler before the
#      intra-scale self-attention in the encoder, enabling attention to focus on
#      informative small-object regions beyond the fixed grid.
#   2. FreqRepC3 – Frequency-Aware RepC3: decomposes FPN/PAN feature maps into
#      high-frequency (detail) and low-frequency (semantic) components; a gated
#      high-frequency branch restores fine-grained details lost during downsampling,
#      boosting recall for small UAV objects on VisDrone / UAVDT.
#
# Baseline:   RT-DETR-L (rtdetr-l.yaml)
# Target:     VisDrone2019, UAVDT small object detection

# Parameters
nc: 80  # number of classes
scales:
  # [depth, width, max_channels]
  l: [1.00, 1.00, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, HGStem, [32, 48]]            # 0-P2/4
  - [-1, 6, HGBlock, [48, 128, 3]]       # stage 1

  - [-1, 1, DWConv, [128, 3, 2, 1, False]]  # 2-P3/8
  - [-1, 6, HGBlock, [96, 512, 3]]       # stage 2

  - [-1, 1, DWConv, [512, 3, 2, 1, False]]  # 4-P4/16
  - [-1, 6, HGBlock, [192, 1024, 5, True, False]]
  - [-1, 6, HGBlock, [192, 1024, 5, True, True]]
  - [-1, 6, HGBlock, [192, 1024, 5, True, True]]  # stage 3

  - [-1, 1, DWConv, [1024, 3, 2, 1, False]]  # 8-P5/32
  - [-1, 6, HGBlock, [384, 2048, 5, True, False]]  # stage 4

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 10  input_proj.2
  - [-1, 1, DA_AIFI, [1024, 8]]                     # 11  DA-AIFI (replaces AIFI)
  - [-1, 1, Conv, [256, 1, 1]]                       # 12  Y5, lateral_convs.0

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [7, 1, Conv, [256, 1, 1, None, 1, 1, False]]    # 14  input_proj.1
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, FreqRepC3, [256]]                        # 16  fpn_blocks.0  (replaces RepC3)
  - [-1, 1, Conv, [256, 1, 1]]                       # 17  Y4, lateral_convs.1

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [3, 1, Conv, [256, 1, 1, None, 1, 1, False]]    # 19  input_proj.0
  - [[-2, -1], 1, Concat, [1]]                       # cat backbone P3
  - [-1, 3, FreqRepC3, [256]]                        # 21  X3, fpn_blocks.1

  - [-1, 1, Conv, [256, 3, 2]]                       # 22  downsample_convs.0
  - [[-1, 17], 1, Concat, [1]]                       # cat Y4
  - [-1, 3, FreqRepC3, [256]]                        # 24  F4, pan_blocks.0

  - [-1, 1, Conv, [256, 3, 2]]                       # 25  downsample_convs.1
  - [[-1, 12], 1, Concat, [1]]                       # cat Y5
  - [-1, 3, FreqRepC3, [256]]                        # 27  F5, pan_blocks.1

  - [[21, 24, 27], 1, RTDETRDecoder, [nc]]           # RTDETRDecoder(P3, P4, P5)

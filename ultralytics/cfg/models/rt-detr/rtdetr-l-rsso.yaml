# Ultralytics 🚀 AGPL-3.0 License - https://ultralytics.com/license
# Ultralytics RT-DETR-l remote-sensing small-object variant with P2/4-P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/rtdetr
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=rtdetr-l-rsso.yaml' will call this yaml with scale 'l'
  # [depth, width, max_channels]
  l: [1.00, 1.00, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, HGStem, [32, 48]] # 0-P2/4
  - [-1, 6, HGBlock, [48, 128, 3]] # 1 stage 1

  - [-1, 1, DWConv, [128, 3, 2, 1, False]] # 2-P3/8
  - [-1, 6, HGBlock, [96, 512, 3]] # 3 stage 2

  - [-1, 1, DWConv, [512, 3, 2, 1, False]] # 4-P4/16
  - [-1, 6, HGBlock, [192, 1024, 5, True, False]] # 5
  - [-1, 6, HGBlock, [192, 1024, 5, True, True]] # 6
  - [-1, 6, HGBlock, [192, 1024, 5, True, True]] # 7 stage 3

  - [-1, 1, DWConv, [1024, 3, 2, 1, False]] # 8-P5/32
  - [-1, 6, HGBlock, [384, 2048, 5, True, False]] # 9 stage 4

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 10 input_proj.2
  - [-1, 1, AIFI, [1024, 8]]
  - [-1, 1, Conv, [256, 1, 1]] # 12 Y5

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [7, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 14 input_proj.1
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, RepC3, [256]] # 16 Y4
  - [-1, 1, Conv, [256, 1, 1]] # 17

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [3, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 19 input_proj.0
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, RepC3, [256]] # 21 X3 (P3/8)

  # Added P2 branch for dense tiny objects in remote sensing imagery
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [1, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 23 backbone P2 projection
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, RepC3, [256]] # 25 P2/4 small-object branch

  # PAN path with lightweight attention refinement
  - [-1, 1, Conv, [256, 3, 2]] # 26 downsample P2->P3
  - [[-1, 21], 1, Concat, [1]]
  - [-1, 3, RepC3, [256]] # 28 P3 refined
  - [-1, 1, C2PSA, [256, 1]] # 29 attention module A

  - [-1, 1, Conv, [256, 3, 2]] # 30 downsample P3->P4
  - [[-1, 17], 1, Concat, [1]]
  - [-1, 3, RepC3, [256]] # 32 P4 refined
  - [-1, 1, C2PSA, [256, 1]] # 33 attention module B

  - [-1, 1, Conv, [256, 3, 2]] # 34 downsample P4->P5
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, RepC3, [256]] # 36 P5 refined
  - [-1, 1, C2PSA, [256, 1]] # 37 attention module C

  - [[25, 29, 33, 37], 1, RTDETRDecoder, [nc]] # RTDETRDecoder(P2, P3, P4, P5)
